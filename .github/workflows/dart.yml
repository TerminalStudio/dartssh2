name: Dart

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# This workflow only reads the repository: it checks out, analyzes, tests, and
# uploads coverage with a token of its own. The Codecov token comes from
# secrets rather than from the GITHUB_TOKEN, so read access is all it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        sdk: [stable]

    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Print Dart SDK version
        run: dart --version

      - name: Install dependencies
        run: dart pub get

      # Uncomment this step to verify the use of 'dart format' on each commit.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Activate coverage tool
        run: dart pub global activate coverage

      - name: Run unit tests with coverage
        run: dart test --exclude-tags=integration --coverage=coverage

      - name: Build LCOV report
        run: dart pub global run coverage:format_coverage --lcov --in=coverage/test --out=coverage/lcov.info --packages=.dart_tool/package_config.json --report-on=lib

      - name: Start a local OpenSSH server
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: tool/start_test_sshd.sh

      - name: Show the server's effective algorithms
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          ssh -vv -p 2222 -o StrictHostKeyChecking=no -o BatchMode=yes \
            dartssh2@127.0.0.1 exit 2>&1 | grep -iE 'peer server KEXINIT|kex algorithms|host key algorithms|ciphers ctos|MACs ctos' || true

      - name: Run integration tests
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          DARTSSH2_LOCAL_SSHD: '1'
        run: dart test --tags=integration

      - name: Stop the local OpenSSH server
        if: always()
        run: docker rm -f dartssh2-test-sshd || true

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          # Fail loudly. With this off, the upload 404'd for every run after
          # the repository moved owners and the step still reported success.
          fail_ci_if_error: true
          files: ./coverage/lcov.info # optional
          flags: unittests # optional
          name: codecov-umbrella # optional
          token: ${{ secrets.CODECOV_TOKEN }} # required
          verbose: true # optional (default = false)
